<!DOCTYPE html>
<html>
<head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Segoe UI Symbol', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    /* Light mode (default) */
    body {
      background: #F5F5F3;
      color: #2D2D2D;
    }
    
    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      body {
        background: #1A1A1A;
        color: #E5E5E0;
      }
      
      .header {
        background: #2D2D2D !important;
        border-bottom-color: #3D3D3D !important;
      }
      
      .header h1 {
        color: #E5E5E0 !important;
      }
      
      .header p {
        color: #A8A8A0 !important;
      }
      
      button {
        background: #2D2D2D !important;
        border-color: #3D3D3D !important;
        color: #E5E5E0 !important;
      }
      
      button:hover {
        background: #3D3D3D !important;
        border-color: #4D4D4D !important;
      }
      
      #status {
        background: #2D2D2D !important;
        border-color: #3D3D3D !important;
      }
      
      #status.success {
        background: #1E3A2E !important;
        border-color: #2E5A4E !important;
        color: #86EFAC !important;
      }
      
      #status.error {
        background: #3A1E1E !important;
        border-color: #5A2E2E !important;
        color: #FECACA !important;
      }
      
      .saved-links {
        border-top-color: #3D3D3D !important;
      }
      
      .saved-links h2 {
        color: #E5E5E0 !important;
      }
      
      .link-item {
        background: #2D2D2D !important;
        border-color: #3D3D3D !important;
      }
      
      .link-item .link-url {
        color: #A8A8A0 !important;
      }
      
      .link-item .link-time {
        color: #706F6C !important;
      }
      
      .download-btn {
        background: #E5E5E0 !important;
        color: #1A1A1A !important;
      }
      
      .download-btn:hover {
        background: #D4D4D0 !important;
      }
      
      .loader {
        border-color: #3D3D3D !important;
        border-top-color: #A16207 !important;
      }
    }
    
    /* Header */
    .header {
      background: white;
      border-bottom: 1px solid #E5E5E0;
      padding: 20px;
    }
    
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      color: #2D2D2D;
      margin-bottom: 6px;
    }
    
    .header p {
      font-size: 13px;
      color: #706F6C;
    }
    
    /* Content */
    .content {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }
    
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    
    button {
      padding: 14px 16px;
      font-size: 14px;
      font-weight: 500;
      border: 1px solid #D4D4D0;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      background: white;
      color: #2D2D2D;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: inherit;
      text-align: left;
    }
    
    button:hover {
      background: #F8F8F6;
      border-color: #A8A8A0;
    }
    
    button:active {
      transform: scale(0.98);
    }
    
    /* Status box */
    #status {
      padding: 16px;
      background: white;
      border: 1px solid #D4D4D0;
      border-radius: 8px;
      font-size: 13px;
      display: none;
      line-height: 1.6;
    }
    
    #status.success {
      background: #F0FDF4;
      border-color: #86EFAC;
      color: #166534;
    }
    
    #status.error {
      background: #FEF2F2;
      border-color: #FECACA;
      color: #991B1B;
    }
    
    /* Saved links section */
    .saved-links {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid #E5E5E0;
    }
    
    .saved-links h2 {
      font-size: 14px;
      font-weight: 600;
      color: #2D2D2D;
      margin-bottom: 12px;
    }
    
    .link-item {
      background: white;
      border: 1px solid #E5E5E0;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 8px;
      font-size: 12px;
    }
    
    .link-item .link-type {
      font-weight: 600;
      color: #A16207;
      margin-bottom: 4px;
    }
    
    .link-item .link-type.find {
      color: #1E40AF;
    }
    
    .link-item .link-url {
      color: #706F6C;
      word-break: break-all;
      font-family: 'Courier New', monospace;
      font-size: 11px;
    }
    
    .link-item .link-time {
      color: #A8A8A0;
      font-size: 11px;
      margin-top: 4px;
    }
    
    .loader {
      border: 2px solid #E5E5E0;
      border-top: 2px solid #A16207;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      display: inline-block;
      margin-right: 8px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .download-btn {
      margin-top: 12px;
      background: #2D2D2D;
      color: white;
      border: none;
      font-size: 13px;
      justify-content: center;
    }
    
    .download-btn:hover {
      background: #1A1A1A;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Solution Finder</h1>
    <p>Share or find Claude solutions</p>
  </div>
  
  <div class="content">
    <div class="buttons">
      <button id="shareBtn">Share Solution</button>
      <button id="findBtn">Find Solution</button>
    </div>
    
    <div id="status"></div>
    
    <div class="saved-links">
      <h2>Recent Links</h2>
      <div id="linksList"></div>
      <button class="download-btn" id="downloadBtn" style="display: none;">
        Download CSV
      </button>
    </div>
  </div>
  
  <script src="sidepanel.js"></script>
</body>
</html>
